<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<title>선생님 - 별빛 등대 지키기</title>
<script src="config.js"></script><script src="common.js"></script>
</head><body><main class="wrap">

<section id="v-setup" class="view glass narrow">
  <h1>🏮 별빛 등대 지키기</h1><p>꺼져 가는 등대 불빛을 우리 반이 함께 지켜요.</p>
  <h3>문제 분야 (여러 개 선택)</h3><div id="cats" class="chips"></div>
  <label>게임 시간</label>
  <select id="dur"><option value="60">1분</option><option value="120" selected>2분</option><option value="180">3분</option></select>
  <label>불빛이 꺼지는 속도</label>
  <select id="lvl"><option value="1">쉬움 (천천히)</option><option value="2" selected>보통</option><option value="3">어려움 (빨리)</option></select>
  <p><button id="create" class="btn btn-yellow">방 만들기</button></p><p id="err" class="err"></p>
</section>

<section id="v-lobby" class="view lobby" hidden>
  <div class="glass center">
    <h2>별빛 등대 지키기</h2><p>휴대폰 카메라로 찍고 들어오세요</p>
    <div id="qr"></div><p>방 번호</p><div id="code" class="code num"></div>
    <small id="url" style="word-break:break-all"></small>
  </div>
  <div class="glass">
    <span class="pill" id="lcats"></span>
    <h3>모인 등대 친구들 <span id="cnt" class="num">0</span>명</h3>
    <div id="grid" class="grid"></div>
    <div style="display:flex;justify-content:space-between">
      <button id="delBtn2" class="btn btn-ghost">방 지우기</button>
      <button id="start" class="btn btn-yellow" disabled>▶ 게임 시작</button>
    </div>
  </div>
</section>

<section id="v-play" class="view" hidden>
  <div class="glass top">
    <div><b style="font-size:22px">🏮 별빛 등대</b><br><small id="pinfo"></small></div>
    <div class="btns">
      <div class="timer"><svg width="46" viewBox="0 0 36 36"><circle cx="18" cy="18" r="16" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="4"/><circle id="ring" cx="18" cy="18" r="16" fill="none" stroke="#ffd65a" stroke-width="4" stroke-linecap="round" stroke-dasharray="100.5" transform="rotate(-90 18 18)"/></svg><b id="tm" class="num">00:00</b></div>
      <button id="stormBtn" class="btn btn-sky">⛈️ 폭풍 부르기</button>
      <button id="repBtn" class="btn btn-yellow">🔧 등대 수리</button>
      <button id="endBtn" class="btn btn-pink">게임 종료</button>
    </div>
  </div>
  <div class="play">
    <div class="glass">
      <div style="display:flex;justify-content:space-between"><b>우리 반 등대 불빛</b><b id="lp" class="num">100%</b></div>
      <div id="gauge" class="gauge"><i style="width:100%"></i></div>
      <div id="scene" class="scene" style="margin-top:10px">
        <div id="beamL" class="beam l"></div><div id="beamR" class="beam r"></div><div class="glow"></div>
        <svg class="tower" viewBox="0 0 120 260"><polygon points="35,250 85,250 72,90 48,90" fill="#f5f0ff"/><polygon points="40,200 80,200 77,170 43,170" fill="#e8506c"/><polygon points="46,140 74,140 71,115 49,115" fill="#e8506c"/><rect x="46" y="62" width="28" height="28" fill="#cfd8ff"/><circle cx="60" cy="76" r="10" fill="#ffe27a"/><polygon points="42,62 60,38 78,62" fill="#e8506c"/></svg>
        <div class="sea"></div>
        <div id="storm" class="stormfx" hidden>⛈️ 폭풍! 불빛이 빨리 꺼져요</div>
      </div>
    </div>
    <div>
      <div class="glass"><h3>등대 친구들 <small>(⭐ = 맞힌 문제)</small></h3><div id="bubs" class="bubs"></div></div>
      <div class="glass stat" style="margin-top:12px">
        <div><small>전체 정답률</small><b id="s1" class="num">0%</b></div>
        <div><small>푼 문제 합계</small><b id="s2" class="num">0</b></div>
        <div><small>어려운 분야</small><b id="s3" style="font-size:16px">-</b></div>
      </div>
      <div class="glass" style="margin-top:12px"><h3>방금 일어난 일</h3><div id="news" class="news"></div></div>
    </div>
  </div>
</section>

<section id="v-result" class="view center" hidden>
  <h1 id="rmsg"></h1><div id="stars" class="stars"></div><div id="rsum"></div>
  <h3>오늘의 상</h3><div id="awards"></div><div id="rest" style="margin-top:12px"></div>
  <p><button id="delBtn" class="btn btn-ghost">학생 기록 지우기</button> <button id="newBtn" class="btn btn-yellow">새 게임 만들기</button></p>
</section>
</main><div id="sync" class="sync"></div>

<script>
let saved = JSON.parse(localStorage.getItem('lh-room') || 'null'), room = null, players = [], lt = null, sync = null, qrFor = '',
    ending = false, prev = {}, news = [], lastStorm = null, lastRep = null, warned = false, celebrated = false, hard = '-', first = true;
const sel = new Set(Object.keys(CATS));
const call = (fn, x = {}) => rpc(fn, { p_room: saved.id, p_code: saved.code, ...x });

/* Step 2: 방 만들기 */
Object.entries(CATS).forEach(([k, v]) => {
  const b = el('button', 'chip on', v);
  b.onclick = () => { sel.has(k) ? sel.delete(k) : sel.add(k); b.classList.toggle('on'); $('#create').disabled = !sel.size; };
  $('#cats').append(b);
});
$('#create').onclick = async () => {
  try {
    $('#err').textContent = '';
    const r = await rpc('create_room', { p_cats: [...sel], p_duration: +$('#dur').value, p_level: +$('#lvl').value });
    saved = { id: r.room_id, code: r.teacher_code }; localStorage.setItem('lh-room', JSON.stringify(saved));
    celebrated = false; first = true; await refresh();
  } catch (e) { $('#err').textContent = e.message; }
};
function forget() {
  localStorage.removeItem('lh-room'); saved = null; room = null; prev = {}; news = []; ending = false; first = true;
  if (sync) { sync.stop(); sync = null; } show('v-setup');
}

async function refresh() {
  try {
    if (!saved) { show('v-setup'); return; }
    const [a, b, c] = await Promise.all([
      db.from('rooms').select('*').eq('id', saved.id).maybeSingle(),
      db.from('players').select('*').eq('room_id', saved.id),
      db.from('lights').select('*').eq('room_id', saved.id).maybeSingle()]);
    if (!a.data) { forget(); return; }
    room = a.data; players = byJoin(b.data || []); lt = c.data;
    if (!sync) { await syncClock(); sync = startSync([{ table: 'rooms', filter: 'id=eq.' + saved.id }, { table: 'players', filter: 'room_id=eq.' + saved.id }], refreshT); }
    if (room.status === 'waiting') lobby(); else if (room.status === 'playing') play(); else result();
  } catch (e) { console.error(e); }
}
const refreshT = throttle(refresh, 400);

function lobby() {
  show('v-lobby'); $('#code').textContent = room.id;
  const url = location.origin + location.pathname.replace(/[^/]*$/, '') + 'student.html?code=' + room.id;
  if (qrFor !== url) { qrFor = url; const qr = qrcode(0, 'M'); qr.addData(url); qr.make(); $('#qr').innerHTML = qr.createSvgTag(5, 0); }
  $('#url').textContent = url;
  $('#lcats').textContent = room.cats.map(t => CATS[t]).join(' · ') + ' · ' + room.duration / 60 + '분';
  $('#cnt').textContent = players.length;
  $('#grid').replaceChildren(...players.map(p => { const d = el('div', 'pl'); d.append(el('div', 'big', p.animal), el('small', '', p.nickname)); return d; }));
  $('#start').disabled = !players.length;
}

/* Step 3: 시작 · 종료 · 타이머(서버 시계) */
$('#start').onclick = () => call('start_game').then(refresh).catch(e => alert(e.message));
$('#endBtn').onclick = () => confirm('게임을 끝낼까요?') && call('end_game').then(refresh);
$('#stormBtn').onclick = () => call('set_storm').then(refresh);
$('#repBtn').onclick = () => call('set_repair').then(refresh).catch(e => alert(e.message));
const del = () => confirm('방과 학생 기록을 모두 지울까요?') && call('delete_room').then(forget);
$('#delBtn').onclick = del; $('#delBtn2').onclick = del; $('#newBtn').onclick = forget;

/* Step 5: 등대 불빛 (DB와 같은 식으로 화면에서 부드럽게 계산, 판정은 DB) */
setInterval(() => {
  if (!room || !lt || room.status !== 'playing') return;
  const left = Date.parse(room.ends_at) - now(), L = lightNow(lt, room);
  $('#tm').textContent = mmss(left);
  $('#ring').style.strokeDashoffset = 100.5 * (1 - Math.max(0, Math.min(1, left / (room.duration * 1000))));
  $('#lp').textContent = Math.round(L) + '%'; $('#gauge i').style.width = L + '%'; $('#gauge').classList.toggle('low', L < 25);
  $('#scene').style.setProperty('--l', L / 100); $('#scene').classList.toggle('danger', L < 25 && L > 0);
  const sl = room.storm_until ? Date.parse(room.storm_until) - now() : 0;
  $('#storm').hidden = sl <= 0; $('#stormBtn').disabled = sl > 0;
  if (L < 25 && !warned) { warned = true; push('⚠️ 등대 불빛이 위험해요! 힘내요!', 1); render(); } if (L >= 40) warned = false;
  if ((L <= 0 || left <= 0) && !ending) { ending = true; call('end_game').then(refresh).finally(() => setTimeout(() => ending = false, 2000)); }
}, 200);

function push(t, hot) { news.unshift({ t, hot }); news = news.slice(0, 5); }
const render = () => $('#news').replaceChildren(...news.map(n => el('div', n.hot ? 'hot' : '', n.t)));
function play() {
  show('v-play');
  $('#pinfo').textContent = `방 번호 ${room.id} · ${players.length}명 참여 중`;
  $('#repBtn').textContent = `🔧 등대 수리 (${room.repairs_left})`; $('#repBtn').disabled = room.repairs_left <= 0;
  if (!first) {
    players.forEach(p => { const o = prev[p.id]; if (o && p.streak > o.st && p.streak % 3 === 0) push(`🔥 ${p.nickname} ${p.streak}연속 정답! 콤보 불빛!`, 1); });
    if (room.storm_until && room.storm_until !== lastStorm) push('⛈️ 폭풍이 왔어요!');
    if (room.repairs_left < lastRep) push('🔧 선생님이 등대를 수리했어요 +25');
  }
  first = false; lastStorm = room.storm_until; lastRep = room.repairs_left;
  prev = Object.fromEntries(players.map(p => [p.id, { st: p.streak }]));
  bubbles(); stats(); render();
}
function bubbles() {
  const box = $('#bubs');
  players.forEach(p => {
    let b = $(`[data-id="${p.id}"]`, box);
    if (!b) { b = el('div', 'bub'); b.dataset.id = p.id; b.append(el('div', 'e', p.animal), el('div', 'n', p.nickname), el('b', 'c num', '0')); box.append(b); }
    const c = $('.c', b);
    if (+c.textContent < p.correct) { b.classList.remove('flash'); void b.offsetWidth; b.classList.add('flash'); }
    c.textContent = p.correct;
  });
}
function stats() {
  const sc = players.reduce((a, p) => a + p.correct, 0), ss = players.reduce((a, p) => a + p.solved, 0);
  $('#s1').textContent = (ss ? Math.round(sc / ss * 100) : 0) + '%'; $('#s2').textContent = ss; $('#s3').textContent = hard;
}
setInterval(async () => {
  if (!room || room.status !== 'playing') return;
  const { data } = await db.from('answers').select('cat,correct').eq('room_id', room.id);
  const m = {}; (data || []).forEach(a => { const t = m[a.cat] || (m[a.cat] = [0, 0]); t[1]++; if (a.correct) t[0]++; });
  const w = Object.entries(m).filter(([, v]) => v[1] >= 3).sort((a, b) => a[1][0] / a[1][1] - b[1][0] / b[1][1])[0];
  hard = w ? CATS[w[0]] : '-';
}, 5000);

/* Step 6: 결과 (순위 대신 별 등급과 여러 상) */
function result() {
  show('v-result');
  const st = starsOf(players, room), dark = room.ended_reason === 'dark';
  $('#rmsg').textContent = dark ? '등대가 꺼졌어요 😢 다시 도전해요!' : '🎉 우리 반이 등대를 지켜냈어요!';
  $('#stars').textContent = st ? '⭐'.repeat(st) : '🌑';
  $('#rsum').textContent = `우리 반이 함께 맞힌 문제 ${players.reduce((a, p) => a + p.correct, 0)}개`;
  $('#awards').replaceChildren(...awardsOf(players).map(a => { const d = el('div', 'award'); d.append(el('b', '', a.t), el('span', '', a.names), el('span', 'num', a.v)); return d; }));
  $('#rest').replaceChildren(...players.map(p => { const d = el('div', 'award'); d.append(el('span', '', p.animal + ' ' + p.nickname), el('span', 'num', `내가 켠 빛 ${p.correct}개`)); return d; }));
  if (!celebrated && st) { celebrated = true; confetti({ particleCount: 160, spread: 90, origin: { y: .4 } }); }
}
refresh();
</script></body></html>
